{% extends "base.html" %}
{% block title %}Chatbot{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image to Anime Converter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme">
<header>
  <h1>Convert Photo to Anime</h1>
  <a href="{{ url_for('dashboard') }}">← Back</a>
</header>

<main>
  <form action="{{ url_for('image_to_anime') }}" method="POST" enctype="multipart/form-data">
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit" class="btn">Convert to Anime</button>
  </form>
</main>
  <div class="container">
  <h1 class="header-title">Your Need<br>in Seconds</h1>

  <form action="/your-action" method="POST">
    <input type="text" name="input_field" placeholder="Type here..." required>
    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
{% endblock %}
