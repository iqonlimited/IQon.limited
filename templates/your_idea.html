{% extends "base.html" %}
{% block title %}Chatbot{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Idea</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="idea-board">
    <h1>Your Idea</h1>
    <form method="POST" action="/submit-idea">
      <input type="text" name="title" placeholder="Your Idea Title" required>
      <textarea name="content" placeholder="Explain your idea or feedback..." required></textarea>
      <button type="submit">Submit Idea</button>
    </form>

    <h2>All Ideas</h2>
    {% for idea in ideas %}
      <div class="idea">
        <h3>{{ idea.title }}</h3>
        <p>{{ idea.content }}</p>
        <small>Submitted by: {{ idea.user }}</small>
      </div>
    {% endfor %}
  </div>
</body>
</html>
{% endblock %}
