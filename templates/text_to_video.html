{% extends "base.html" %}
{% block title %}Text to Video Generator{% endblock %}

{% block content %}
<h1>Generate Video from Text</h1>

<div class="center-form">
  <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
</div>

<hr>

<form action="{{ url_for('text_to_video') }}" method="POST" class="center-form">
  <textarea name="script" rows="6" placeholder="Enter your script here..." required></textarea><br><br>
  <button type="submit">Generate Video</button>
</form>
{% endblock %}
