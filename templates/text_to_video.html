{% extends "base.html" %}
{% block title %}Chatbot{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Video Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme">
<header>
  <h1>Generate Video from Text</h1>
  <a href="{{ url_for('dashboard') }}">← Back</a>
</header>

<main>
  <form action="{{ url_for('text_to_video') }}" method="POST">
    <textarea name="script" placeholder="Enter your script here..." required></textarea>
    <button type="submit" class="btn">Generate Video</button>
  </form>
</main>
  <div class="container">
  <h1 class="header-title">Your Need<br>in Seconds</h1>

  <form action="/your-action" method="POST">
    <input type="text" name="input_field" placeholder="Type here..." required>
    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
{% endblock %}
