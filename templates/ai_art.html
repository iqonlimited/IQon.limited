{% extends "base.html" %}
{% block title %}AI Art Generator{% endblock %}

{% block content %}
<h1>Generate AI Art</h1>

<div class="center-form">
  <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
</div>

<hr>

<form method="POST" action="{{ url_for('generate_ai_art') }}" class="center-form">
  <input type="text" name="prompt" placeholder="Describe your image..." required><br><br>
  <button type="submit">Generate</button>
</form>

{% if image_url %}
  <hr>
  <h2>Generated Result</h2>
  <div class="center-form">
    <img src="{{ image_url }}" alt="Generated AI Art" style="max-width: 100%; border: 1px solid #ccc; padding: 5px;">
  </div>
{% endif %}
{% endblock %}
