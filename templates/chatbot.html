{% extends "base.html" %}
{% block content %}
<h1>Feel Free to Ask</h1>
<form method="POST">
  <input type="text" name="user_input" placeholder="Ask something..." required>
  <button type="submit">Send</button>
</form>

<div>
  {% for msg in chat_history %}
    <p><strong>{{ msg.role }}:</strong> {{ msg.text }}</p>
  {% endfor %}
</div>
{% endblock %}
