{% extends "base.html" %}
{% block title %}Chatbot{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - AI App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-body">
  <div class="login-container">
    <h2>Login to AI App</h2>
    <form action="{{ url_for('login') }}" method="POST">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password or Passcode" required />

      <button type="submit">Login</button>
    </form>

    <p class="register-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    {% if error %}
      <p class="error-message">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
{% endblock %}
