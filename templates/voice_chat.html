{% extends "base.html" %}
{% block title %}Voice Assistant{% endblock %}

{% block content %}
<h1>Talk to AI</h1>

<div class="center-form">
  <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
</div>

<hr>

<div class="center-form">
  <button onclick="startListening()">🎙 Start Talking</button>
</div>

<div id="transcript" class="center-form"></div>

<script>
  function startListening() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.start();

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("transcript").innerText = "You said: " + transcript;
      // TODO: You can send transcript to backend using fetch or AJAX here
    };

    recognition.onerror = (event) => {
      document.getElementById("transcript").innerText = "Error: " + event.error;
    };
  }
</script>
{% endblock %}
