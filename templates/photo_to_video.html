{% extends "base.html" %}
{% block title %}Photo to Video{% endblock %}

{% block content %}
<h1>Create Video from Photos</h1>

<div class="center-form">
  <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
</div>

<hr>

<form action="{{ url_for('photo_to_video') }}" method="POST" enctype="multipart/form-data" class="center-form">
  <input type="file" name="photos" accept="image/*" multiple required><br><br>

  <label for="template">Choose Template:</label><br>
  <select name="template" id="template">
    <option value="slideshow">Slideshow</option>
    <option value="cinematic">Cinematic</option>
  </select><br><br>

  <button type="submit">Generate Video</button>
</form>
{% endblock %}
